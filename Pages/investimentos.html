        <div class="container">
            <h2>Meus Investimentos 📈</h2>

            <form>
                <div id="lista-investimento">
                <label for="tipo-investimento">📊 Tipo de Investimento:</label>

                <label for="valor-investimento">💰 Valor:</label>
                <input type="number" id="valor-investimento" placeholder="R$ 0,00">
                </div>
                <button type="button" id="btn-adicionar">+ adicionar investimento</button>

                <button type="submit">Salvar</button>
                
            </form>
            <div id="resultado"></div>
        </div>
